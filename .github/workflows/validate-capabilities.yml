name: SDK Compliance

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    uses: supabase/sdk/.github/workflows/validate-sdk-compliance-javascript.yml@6f0d68ef8e06d297ba3bd3f0b41feaa80a7c64e0 # capability-matrix/v1.16.0
    with:
      build-command: |
        corepack enable
        pnpm install --frozen-lockfile
        pnpm nx run-many --target=docs:json --output-style=stream
      spec-glob: packages/core/*/docs/v2/spec.json

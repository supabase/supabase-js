name: SDK Compliance

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    uses: supabase/sdk/.github/workflows/validate-sdk-compliance-javascript.yml@1f5fd0a64e982886aeeb6cad2c3b64cbb499d080 # capability-matrix-v1.8.0
    with:
      build-command: |
        corepack enable
        pnpm install --frozen-lockfile
        pnpm nx run-many --target=docs:json --output-style=stream
      spec-glob: packages/core/*/docs/v2/spec.json

name: Sync SDK Compliance Matrix

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  sync:
    permissions:
      contents: write
      pull-requests: write
    uses: supabase/sdk/.github/workflows/sync-sdk-compliance.yml@85867c5d06a15ecc0b49c07dd21682966d5c7be5 # capability-matrix/v1.15.0
    with:
      base-branch: master
    secrets:
      client-id: ${{ secrets.APP_CLIENT_ID }}
      private-key: ${{ secrets.PRIVATE_KEY }}

name: Sync SDK Compliance Matrix

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  sync:
    permissions:
      contents: write
      pull-requests: write
    uses: supabase/sdk/.github/workflows/sync-sdk-compliance.yml@e7754fe8698888811b732eb93e1cd14dff5baafb # capability-matrix/v2.2.0
    with:
      base-branch: master
    secrets:
      client-id: ${{ secrets.APP_CLIENT_ID }}
      private-key: ${{ secrets.PRIVATE_KEY }}

name: Sync SDK Compliance Matrix

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  sync:
    permissions:
      contents: write
      pull-requests: write
    uses: supabase/sdk/.github/workflows/sync-sdk-compliance.yml@5bd367cd2a88a1d99ed3060154069caf0381d5ff # capability-matrix/v1.13.0
    with:
      base-branch: master
    secrets:
      client-id: ${{ secrets.APP_CLIENT_ID }}
      private-key: ${{ secrets.PRIVATE_KEY }}
